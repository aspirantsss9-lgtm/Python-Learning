<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DjangoStore{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
            color: #222;
        }

        header {
            background-color: #222;
            padding: 15px 30px;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .product-card h2 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            padding: 8px 14px;
            margin-top: 10px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .button:hover {
            background-color: #555;
        }

        form {
            background-color: white;
            padding: 25px;
            border-radius: 6px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .error {
            color: #b00020;
            margin-top: 5px;
        }

        .form-errors {
            background-color: #ffe5e5;
            border: 1px solid #ffaaaa;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .detail-row {
            margin-bottom: 15px;
        }

        .detail-label {
            font-weight: bold;
        }
    </style>
</head>

<body>
<header>
    <a href="{% url 'product_list' %}">DjangoStore</a>
    <a href="{% url 'product_list' %}">Товары</a>
    <a href="{% url 'product_create' %}">Добавить товар</a>
    <a href="/admin/">Админка</a>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>
</body>
</html>
