<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Homework</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/style.css') }}"
    >
</head>
<body>

<div class="container">

    <h1>Заметки</h1>

    <section class="form-section">
        <h2>Добавить запись</h2>

        <form action="/notes" method="post">

            <label for="title">Заголовок</label>
            <input
                id="title"
                name="title"
                type="text"
                maxlength="200"
                required
            >

            <label for="content">Текст</label>
            <textarea
                id="content"
                name="content"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Добавить
            </button>

        </form>
    </section>

    <section class="notes-section">
        <h2>Сохранённые записи</h2>

        {% if notes %}

            {% for note in notes %}

                <article class="note">

                    <h3>{{ note.title }}</h3>

                    <p>{{ note.content }}</p>

                    <small>
                        ID: {{ note.id }} |
                        Создано: {{ note.created_at }}
                    </small>

                </article>

            {% endfor %}

        {% else %}

            <p>Записей пока нет.</p>

        {% endif %}

    </section>

</div>

</body>
</html>
